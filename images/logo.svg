<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <!-- NALA Sovereign Vector Logo -->
  <g id="Emblem" transform="translate(20, 10)">
    <!-- Hexagonal Outer Accent Frame -->
    <polygon points="100,20 155,52 155,168 100,200 45,168 45,52" fill="none" stroke="#E8791A" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Outer Node Pins -->
    <line x1="100" y1="5" x2="100" y2="20" stroke="#111827" stroke-width="2.5"/>
    <circle cx="100" cy="5" r="4.5" fill="#FAF9F6" stroke="#E8791A" stroke-width="2.5"/>

    <line x1="100" y1="200" x2="100" y2="215" stroke="#111827" stroke-width="2.5"/>
    <circle cx="100" cy="215" r="4.5" fill="#FAF9F6" stroke="#E8791A" stroke-width="2.5"/>

    <line x1="20" y1="110" x2="45" y2="110" stroke="#111827" stroke-width="2.5"/>
    <circle cx="18" cy="110" r="4.5" fill="#FAF9F6" stroke="#E8791A" stroke-width="2.5"/>

    <line x1="155" y1="110" x2="180" y2="110" stroke="#111827" stroke-width="2.5"/>
    <circle cx="182" cy="110" r="4.5" fill="#FAF9F6" stroke="#E8791A" stroke-width="2.5"/>

    <!-- Double Infinity Loop Nodes -->
    <path d="M 100,110 C 65,65 30,110 30,110 C 30,110 65,155 100,110 C 135,65 170,110 170,110 C 170,110 135,155 100,110 Z" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stylized Interlocking N Stem Lines -->
    <line x1="65" y1="42" x2="65" y2="178" stroke="#111827" stroke-width="4.5"/>
    <line x1="65" y1="42" x2="135" y2="178" stroke="#111827" stroke-width="4.5"/>
    <line x1="135" y1="42" x2="135" y2="178" stroke="#111827" stroke-width="4.5"/>

    <!-- Vertical Axis Line & Micro Dots -->
    <line x1="100" y1="20" x2="100" y2="200" stroke="#111827" stroke-width="2"/>
    <circle cx="100" cy="72" r="2.5" fill="#E8791A"/>
    <circle cx="100" cy="148" r="2.5" fill="#E8791A"/>

    <!-- Glowing Core Saffron Dot -->
    <circle cx="100" cy="110" r="12" fill="#FAF9F6" stroke="#111827" stroke-width="3"/>
    <circle cx="100" cy="110" r="6" fill="#E8791A"/>
  </g>

  <!-- Typography Right Section -->
  <g id="Typography" transform="translate(230, 0)">
    <!-- Main NALA Title -->
    <text x="0" y="115" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="78" font-weight="700" letter-spacing="4" fill="#111827">
      N A L<tspan fill="#111827">A</tspan>
    </text>
    <!-- Saffron Dot inside final A -->
    <circle cx="178" cy="100" r="4.5" fill="#E8791A"/>

    <!-- Subtitle 1: Full Form -->
    <text x="2" y="142" font-family="'Manrope', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.18em" fill="#111827">
      NEXUS AGENT LEARNING &amp; AUTONOMY
    </text>

    <!-- Divider Line with Center Accent Dot -->
    <line x1="2" y1="156" x2="310" y2="156" stroke="#E8791A" stroke-width="1.2"/>
    <circle cx="156" cy="156" r="3" fill="#E8791A"/>

    <!-- Subtitle 2: Lab Identity -->
    <g transform="translate(0, 178)">
      <line x1="12" y1="-4" x2="42" y2="-4" stroke="#111827" stroke-width="1"/>
      <text x="56" y="0" font-family="'Manrope', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.35em" fill="#111827">
        NEXUS LAB AI
      </text>
      <line x1="222" y1="-4" x2="252" y2="-4" stroke="#111827" stroke-width="1"/>
    </g>
  </g>
</svg>
