<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClaudeDesk v6.1 | Interactive Galaxy</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo">⚛️</div>
                <h1>ClaudeDesk</h1>
                <span class="version">v6.0</span>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item active" onclick="showSection('dashboard')">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="#" class="nav-item" onclick="showSection('galaxy')">
                    <span class="icon">🌌</span> Galaxy View
                </a>
                <a href="#" class="nav-item" onclick="showSection('audit')">
                    <span class="icon">🛡️</span> Security Log
                </a>
            </nav>

            <div class="system-status">
                <div class="status-item">
                    <span class="label">Security</span>
                    <span class="value secure">NON-CRITICAL</span>
                </div>
                <div class="status-item">
                    <span class="label">AI Core</span>
                    <span class="value active">ONLINE</span>
                </div>
                <div class="status-item">
                    <span class="label">Quantum</span>
                    <span class="value active">STABLE</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="breadcrumbs">System / Dashboard</div>
                <div class="user-profile">
                    <span class="user-name">Admin</span>
                    <div class="avatar">👨‍🚀</div>
                </div>
            </header>

            <!-- Dashboard Section -->
            <section id="dashboard" class="content-section active">
                <div class="grid-container">
                    <div class="card command-center">
                        <h2>⌨️ Command Interface</h2>
                        <div class="terminal-output" id="terminalOutput">
                            <div class="line">System initialized...</div>
                            <div class="line">Waiting for input...</div>
                        </div>
                        <div class="command-input-wrapper">
                            <span class="prompt">></span>
                            <input type="text" id="commandInput" placeholder="Enter command (e.g., explore, scan)..."
                                autocomplete="off">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Galaxy Section -->
            <section id="galaxy" class="content-section">
                <!-- Three.js Container -->
                <div id="galaxy-canvas"
                    style="width: 100%; height: 100%; position: relative; border-radius: 8px; overflow: hidden;"></div>
            </section>

            <!-- Audit Section -->
            <section id="audit" class="content-section">
                <div class="card full-height">
                    <h2>🛡️ Forensic Audit Logs</h2>
                    <table class="audit-table">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Operation</th>
                                <th>File</th>
                                <th>User</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="auditTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
